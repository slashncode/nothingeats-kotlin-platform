# Single source of truth for all versions in NothingEats Kotlin repos.
# Published as io.github.slashncode.nothingeats:version-catalog and consumed by every service.

[versions]
nothingeats-platform = "0.1.0-SNAPSHOT"
java = "25"
kotlin = "2.4.21"
ksp = "2.3.12"
coroutines = "1.11.0"
serialization = "1.12.0"
ktor = "3.6.0"
kotlin-inject = "0.9.0"
hoplite = "3.0.4"
exposed = "1.6.0"
hikari = "7.1.0"
postgresql = "42.7.14"
flyway = "13.11.1"
kafka = "4.4.0"
lettuce = "7.9.0.RELEASE"
grpc = "1.85.1"
grpc-kotlin = "1.5.0"
protobuf = "4.36.2"
protobuf-gradle-plugin = "0.10.0"
posthog-server = "2.22.0"
bouncycastle = "1.86"
java-jwt = "4.6.0"
angus-mail = "2.0.5"
slf4j = "2.0.17"
logback = "1.6.6"
logstash-encoder = "9.0"
# Pinned above what other libraries and plugins bring along, for fixed vulnerabilities:
# Jackson 2 (Ktor's java-jwt, Jib), Jackson 3 (logstash-encoder), lz4 (kafka-clients),
# freemarker (Kover's reports), commons-lang3 (Jib).
jackson2 = "2.22.4"
jackson3 = "3.2.4"
lz4 = "1.12.1"
freemarker = "2.3.35"
commons-lang3 = "3.21.0"
micrometer = "1.17.2"
kotest = "6.2.6"
mockk = "1.14.11"
testcontainers = "2.0.5"
konsist = "0.18.1"
kover = "0.9.11"
ktlint-gradle = "14.2.0"
jib = "3.5.4"

[libraries]
# NothingEats platform
nothingeats-platform-bom = { module = "io.github.slashncode.nothingeats:platform-bom", version.ref = "nothingeats-platform" }
nothingeats-platform-core = { module = "io.github.slashncode.nothingeats:platform-core", version.ref = "nothingeats-platform" }
nothingeats-platform-http = { module = "io.github.slashncode.nothingeats:platform-http", version.ref = "nothingeats-platform" }
nothingeats-platform-persistence = { module = "io.github.slashncode.nothingeats:platform-persistence", version.ref = "nothingeats-platform" }
nothingeats-platform-kafka = { module = "io.github.slashncode.nothingeats:platform-kafka", version.ref = "nothingeats-platform" }
nothingeats-platform-valkey = { module = "io.github.slashncode.nothingeats:platform-valkey", version.ref = "nothingeats-platform" }
nothingeats-platform-grpc = { module = "io.github.slashncode.nothingeats:platform-grpc", version.ref = "nothingeats-platform" }
nothingeats-ktor-posthog = { module = "io.github.slashncode.nothingeats:ktor-posthog", version.ref = "nothingeats-platform" }
nothingeats-platform-testing = { module = "io.github.slashncode.nothingeats:platform-testing", version.ref = "nothingeats-platform" }

# Kotlin
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
kotlinx-coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Ktor
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages" }
ktor-server-call-id = { module = "io.ktor:ktor-server-call-id" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation" }

# DI
kotlin-inject-compiler = { module = "me.tatarka.inject:kotlin-inject-compiler-ksp", version.ref = "kotlin-inject" }
kotlin-inject-runtime = { module = "me.tatarka.inject:kotlin-inject-runtime", version.ref = "kotlin-inject" }

# Config
hoplite-core = { module = "com.sksamuel.hoplite:hoplite-core", version.ref = "hoplite" }

# Persistence
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# Messaging
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }

# gRPC and protobuf (code generation: nothingeats.grpc convention plugin)
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-services = { module = "io.grpc:grpc-services" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }

# Security
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "java-jwt" }

# Mail
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angus-mail" }

# Product analytics
posthog-server = { module = "com.posthog:posthog-server", version.ref = "posthog-server" }

# Logging & metrics
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-encoder" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
jackson3-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson3" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }
freemarker = { module = "org.freemarker:freemarker", version.ref = "freemarker" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# Testing
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

# Gradle plugins as libraries (for build-logic)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
jib-gradle-plugin = { module = "com.google.cloud.tools:jib-gradle-plugin", version.ref = "jib" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf-gradle-plugin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
